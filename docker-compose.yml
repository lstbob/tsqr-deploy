services:
  postgres:
    image: postgres:16
    container_name: tsqr-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/01-create-dbs.sh:/docker-entrypoint-initdb.d/01-create-dbs.sh:ro
      - ./infra/02-tool-library.sql:/docker-entrypoint-initdb.d/02-tool-library.sql:ro
      - ./infra/03-autheo.sql:/docker-entrypoint-initdb.d/03-autheo.sql:ro
      - ./infra/04-support.sql:/docker-entrypoint-initdb.d/04-support.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - tsqr-net

  tool-lib:
    build:
      context: ../tsqr-tool-lib
      dockerfile: Dockerfile
      args:
        GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN}
    container_name: tsqr-tool-lib
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: ${TOOL_LIB_CONNECTION}
      Jwt__Key: ${JWT_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/dashboard/stats || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - tsqr-net

  autheo:
    build:
      context: ../tsqr-autheo
      dockerfile: Dockerfile
      args:
        GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN}
    container_name: tsqr-autheo
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: ${AUTHEO_CONNECTION}
      Jwt__Key: ${JWT_KEY}
      ASPNETCORE_ENVIRONMENT: Production
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/auth/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - tsqr-net

  support:
    build:
      context: ../tsqr-support
      dockerfile: Dockerfile
      args:
        GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN}
    container_name: tsqr-support
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: ${SUPPORT_CONNECTION}
      Jwt__Key: ${JWT_KEY}
      ASPNETCORE_ENVIRONMENT: Production
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/support/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - tsqr-net

  gateway:
    build:
      context: ../tsqr-gateway
      dockerfile: Dockerfile
    container_name: tsqr-gateway
    ports:
      - "5000:8080"
    depends_on:
      tool-lib:
        condition: service_healthy
      autheo:
        condition: service_healthy
      support:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      Jwt__Key: ${JWT_KEY}
    security_opt:
      - no-new-privileges:true
    networks:
      - tsqr-net

  ui:
    build:
      context: ../tsqr-ui
      dockerfile: Dockerfile
    container_name: tsqr-ui
    environment:
      API_URL: "http://gateway:8080"
      NEXT_PUBLIC_SUPPORT_URL: "http://localhost:4200"
    security_opt:
      - no-new-privileges:true
    networks:
      - tsqr-net

  support-ui:
    build:
      context: ../tsqr-support-ui
      dockerfile: Dockerfile
    container_name: tsqr-support-ui
    depends_on:
      support:
        condition: service_healthy
    ports:
      - "4200:80"
    security_opt:
      - no-new-privileges:true
    networks:
      - tsqr-net

volumes:
  pgdata:

networks:
  tsqr-net:
    driver: bridge